[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h-openshell"
version = "0.1.0.dev0"
description = "Async NVIDIA OpenShell gateway client and NeMo Agent Toolkit plugin"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{name = "h-network"}]
dependencies = [
  "grpcio>=1.60,<2",
  "nvidia-nat>=1.6,<2",
  "protobuf>=5.27.2,<8",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
]

[project.entry-points."nat.components"]
h_openshell = "nat.plugins.h_openshell.register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nat.*"]
namespaces = true

[tool.setuptools.package-data]
"nat.plugins.h_openshell._proto" = ["*.proto", "PROVENANCE.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
