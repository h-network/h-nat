llms:
  agent_llm:
    _type: openai
    model_name: ${H_NAT_LLM_MODEL}
    base_url: ${H_NAT_LLM_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    temperature: 0.0

function_groups:
  junos_mcp:
    _type: mcp_client
    server:
      transport: streamable-http
      url: ${JUNOS_MCP_URL}
      custom_headers:
        Authorization: Bearer ${JUNOS_MCP_TOKEN}
    include:
      - gather_device_facts
      - get_junos_config
      - get_router_list
      - junos_config_diff

functions:
  network_gate:
    _type: h_asimov_gate
    llm_name: agent_llm
    fail_open: false
    ground_rules_inline: |
      Allow read-only network inspection explicitly requested by the operator.
      Deny destructive, disruptive, credential-accessing, or unrequested device
      operations. Configuration changes require clear operator intent, bounded
      targets, and reviewable content. When the effect is unclear, deny.

  gated_execute_junos_command:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: execute_junos_command

  gated_execute_junos_pfe_command:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: execute_junos_pfe_command

  gated_execute_junos_command_batch:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: execute_junos_command_batch

  gated_render_and_apply_j2_template:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: render_and_apply_j2_template

  gated_load_and_commit_config:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: load_and_commit_config

workflow:
  _type: tool_calling_agent
  llm_name: agent_llm
  tool_names:
    - junos_mcp
    - gated_execute_junos_command
    - gated_execute_junos_pfe_command
    - gated_execute_junos_command_batch
    - gated_render_and_apply_j2_template
    - gated_load_and_commit_config
  handle_tool_errors: true
  max_iterations: 8
  system_prompt: |
    You are a network operations assistant. Use the available inspection tools
    for facts. Device command, PFE, batch, template, and commit operations are
    exposed only through safety-gated tools; report denials without bypassing
    or rephrasing them.
