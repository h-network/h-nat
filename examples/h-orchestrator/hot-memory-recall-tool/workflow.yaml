llms:
  chat_llm:
    _type: openai
    model_name: ${H_NAT_LLM_MODEL}
    base_url: ${H_NAT_LLM_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    temperature: 0.0
    request_timeout: 120

functions:
  recall_search:
    _type: h_semantic_search
    redis_url: ${H_NAT_REDIS_URL}
    pod: recall-demo
    agent: assistant
    rrf_k: 60
    candidate_pool_multiplier: 2

  recall_agent:
    _type: tool_calling_agent
    llm_name: chat_llm
    tool_names: [recall_search]
    verbose: true
    handle_tool_errors: true
    max_iterations: 4
    system_prompt: |
      Answer from the current conversation when it contains enough information.
      recall_search is only for facts missing from the current conversation.
      Do not call recall_search for general knowledge, arithmetic, greetings, or
      facts already visible in the prompt.
      When recall is necessary, call recall_search with chat_id "recall-demo-chat",
      a concise query, top_k 3, and mode "hybrid". Use returned documents to answer.

workflow:
  _type: h_chat_cycle
  dispatcher: recall_agent
  chat_id: recall-demo-chat
  pod: recall-demo
  agent: assistant
  redis_url: ${H_NAT_REDIS_URL}
  hot_keep_count: 6
  ttl_seconds: 86400

