general:
  front_end:
    _type: fastapi
    host: 127.0.0.1
    port: 8080
    workflow:
      method: POST
      path: /v1/workflow
      websocket_path: /websocket
      description: Chat with bounded hot memory and semantic long-term recall.
    endpoints:
      - function_name: delete_chat
        method: POST
        path: /maintenance/reset
        description: Clear the configured conversation's hot-memory session.
      - function_name: semantic_sweep
        method: POST
        path: /maintenance/sweep
        description: Move eligible hot turns into the long-term audit tier.
      - function_name: semantic_vectorize
        method: POST
        path: /maintenance/vectorize
        description: Embed pending long-term audit turns for semantic recall.

llms:
  chatbot_llm:
    _type: openai
    model_name: ${H_NAT_LLM_MODEL}
    base_url: ${H_NAT_LLM_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    temperature: 0.0
    request_timeout: 120

function_groups:
  junos_mcp:
    _type: mcp_client
    server:
      transport: streamable-http
      url: ${JUNOS_MCP_URL}
      custom_headers:
        Authorization: Bearer ${JUNOS_MCP_TOKEN}
    include:
      - gather_device_facts
      - get_junos_config
      - get_router_list
      - junos_config_diff

functions:
  delete_chat:
    _type: h_memory_delete_chat
    redis_url: ${H_NAT_REDIS_URL}
    pod: ${H_NAT_CHATBOT_POD}
    agent: ${H_NAT_CHATBOT_AGENT}

  recall_search:
    _type: h_semantic_search
    redis_url: ${H_NAT_REDIS_URL}
    pod: ${H_NAT_CHATBOT_POD}
    agent: ${H_NAT_CHATBOT_AGENT}
    rrf_k: 60
    candidate_pool_multiplier: 2

  network_gate:
    _type: h_asimov_gate
    llm_name: chatbot_llm
    fail_open: false
    ground_rules_inline: |
      Allow read-only network inspection explicitly requested by the operator.
      Deny destructive, disruptive, credential-accessing, or unrequested device
      operations. Configuration changes require clear operator intent, bounded
      targets, and reviewable content. When the effect is unclear, deny.

  gated_execute_junos_command:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: execute_junos_command

  gated_execute_junos_pfe_command:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: execute_junos_pfe_command

  gated_execute_junos_command_batch:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: execute_junos_command_batch

  gated_render_and_apply_j2_template:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: render_and_apply_j2_template

  gated_load_and_commit_config:
    _type: h_gated_mcp_tool
    mcp_group: junos_mcp
    gate_fn: network_gate
    mcp_tool_name: load_and_commit_config

  semantic_sweep:
    _type: h_semantic_sweep
    redis_url: ${H_NAT_REDIS_URL}
    pod: ${H_NAT_CHATBOT_POD}
    agent: ${H_NAT_CHATBOT_AGENT}
    migration_threshold_sec: ${H_NAT_CHATBOT_MIGRATION_THRESHOLD_SEC}
    max_per_cycle: 0

  semantic_vectorize:
    _type: h_semantic_vectorize
    redis_url: ${H_NAT_REDIS_URL}
    pod: ${H_NAT_CHATBOT_POD}
    agent: ${H_NAT_CHATBOT_AGENT}
    batch_size: ${H_NAT_CHATBOT_VECTORIZE_BATCH_SIZE}
    max_per_cycle: 0

  chatbot_agent:
    _type: tool_calling_agent
    llm_name: chatbot_llm
    tool_names:
      - recall_search
      - junos_mcp
      - gated_execute_junos_command
      - gated_execute_junos_pfe_command
      - gated_execute_junos_command_batch
      - gated_render_and_apply_j2_template
      - gated_load_and_commit_config
    handle_tool_errors: true
    max_iterations: 6
    system_prompt: |
      You are a concise conversational assistant. Answer from the recent
      conversation when it contains enough information. When the user asks
      about an earlier personal fact that is no longer visible, call
      recall_search with chat_id "${H_NAT_CHATBOT_CHAT_ID}", a concise query,
      top_k 5, and mode "hybrid". Use retrieved turns to answer precisely.
      Do not call recall_search for general knowledge, greetings, arithmetic,
      or facts already present in recent context. Never invent remembered
      facts.
      Use the Junos inspection tools for requested network facts. Device
      command, PFE, batch, template, and commit operations are exposed only
      through safety-gated tools; report denials without bypassing, splitting,
      or rephrasing denied operations.

workflow:
  _type: h_chat_cycle
  dispatcher: chatbot_agent
  chat_id: ${H_NAT_CHATBOT_CHAT_ID}
  pod: ${H_NAT_CHATBOT_POD}
  agent: ${H_NAT_CHATBOT_AGENT}
  redis_url: ${H_NAT_REDIS_URL}
  hot_keep_count: ${H_NAT_CHATBOT_HOT_KEEP_COUNT}
  ttl_seconds: 86400
