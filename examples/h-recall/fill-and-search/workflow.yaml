functions:
  sweep:
    _type: h_semantic_sweep
    redis_url: ${H_NAT_REDIS_URL}
    pod: recall_demo
    agent: assistant
    migration_threshold_sec: 1
    max_per_cycle: 0

  vectorize:
    _type: h_semantic_vectorize
    redis_url: ${H_NAT_REDIS_URL}
    pod: recall_demo
    agent: assistant
    batch_size: 64
    max_per_cycle: 0

  search:
    _type: h_semantic_search
    redis_url: ${H_NAT_REDIS_URL}
    pod: recall_demo
    agent: assistant
    rrf_k: 60
    candidate_pool_multiplier: 2

workflow:
  _type: h_semantic_search
  redis_url: ${H_NAT_REDIS_URL}
  pod: recall_demo
  agent: assistant
