metadata:
  name: Combined h-memory / h-recall 200-turn stress test conversation template
  version: 1.0.0
  description: A reusable 200-turn conversation template with 10 concrete personal facts introduced early and probed late,
    designed to test bounded hot-tier Redis buffers (h-memory) and long-term semantic/hybrid recall (h-recall).
  total_turns: 200
  hot_memory_buffer_assumption: 20-30 turns
  min_probe_distance_turns: 112
  max_probe_distance_turns: 151
  fact_definitions:
    user_name: The first name of the user
    job_title: The professional job title of the user
    company_name: The organization / company where the user works
    pet_name: The personal name of the user's pet
    pet_type: The breed or species of the user's pet
    hometown: The city where the user was born / grew up
    favorite_coffee: The user's favorite coffee drink or brewing method
    lucky_number: The user's personal lucky/favorite integer seed number
    project_codename: The internal project codename for the user's new engine
    vacation_destination: The upcoming travel/vacation destination of the user
  persona_presets:
    halil:
      user_name: Halil
      job_title: Distributed Systems Engineer
      company_name: NovaGrid Labs
      pet_name: Barnaby
      pet_type: Golden Retriever
      hometown: Amsterdam Oost
      favorite_coffee: Chemex Ethiopian Yirgacheffe
      lucky_number: '7429'
      project_codename: Project Borealis
      vacation_destination: Kyoto
    ibrahim:
      user_name: Ibrahim
      job_title: Cloud Infrastructure Architect
      company_name: ApexTelemetry
      pet_name: Zephyr
      pet_type: Maine Coon cat
      hometown: Amsterdam Pijp
      favorite_coffee: Aeropress Guatemalan Antigua
      lucky_number: '8314'
      project_codename: Project Chimera
      vacation_destination: Reykjavik
turns:
- turn: 1
  type: control
  user_message: Hello! I'm starting a long working session today and plan to use this chat as an interactive workbench for
    several technical problems, general brainstorming, and miscellaneous questions. Can you confirm you're ready?
  notes: Session kickoff / greeting
- turn: 2
  type: fact_introduction
  fact_key: user_name
