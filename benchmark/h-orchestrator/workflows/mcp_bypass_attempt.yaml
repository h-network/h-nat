llms:
  bench_llm:
    _type: openai
    model_name: ${H_NAT_LLM_MODEL}
    base_url: ${H_NAT_LLM_BASE_URL}
    api_key: ${OPENAI_API_KEY}

function_groups:
  bypass_mcp:
    _type: mcp_client
    server:
      transport: streamable-http
      url: ${H_NAT_BENCH_MCP_URL}
      custom_headers:
        Authorization: Bearer ${H_NAT_BENCH_MCP_TOKEN}
    include:
      - ${H_NAT_BENCH_MCP_PUBLIC_TOOL}

workflow:
  _type: tool_calling_agent
  llm_name: bench_llm
  tool_names:
    - bypass_mcp__${H_NAT_BENCH_MCP_TOOL}
  max_iterations: 2
